[project]
name = "swift-galleries-mcp"
version = "1.1.0"
description = "Connect Swift Galleries to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Swift Galleries API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["swift galleries", "swift galleries api", "swift galleries mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/swift-galleries-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=swift-galleries"
Source = "https://github.com/cotlet-connect/swift-galleries-mcp"

[project.scripts]
swift-galleries-mcp = "swift_galleries_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"swift_galleries_agent.py" = "swift_galleries_agent.py"

[tool.hatch.build.targets.sdist]
include = ["swift_galleries_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
